name: Deploy preview to GitHub Pages

on:
  push:
    branches: ['claude/dreamy-heisenberg-oy4vbh']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TomTom key reaches the build
        env:
          VITE_TOMTOM_KEY: ${{ secrets.VITE_TOMTOM_KEY }}
        run: |
          if [ -z "$VITE_TOMTOM_KEY" ]; then
            echo "::warning title=TomTom key missing::VITE_TOMTOM_KEY is EMPTY at build time — the deployed map will use the behavioural-model fallback and routes will show the demo path. Add it as a REPOSITORY secret (Settings → Secrets and variables → Actions → New repository secret), named exactly VITE_TOMTOM_KEY, then re-run this workflow."
          else
            echo "VITE_TOMTOM_KEY is present at build time (length ${#VITE_TOMTOM_KEY}) — live TomTom will be enabled."
          fi

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_TOMTOM_KEY: ${{ secrets.VITE_TOMTOM_KEY }}

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # SPA: serve index.html for unknown paths
          # (single-page app with a state-based view switcher, no router)
